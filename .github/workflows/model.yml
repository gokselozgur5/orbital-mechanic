name: Model and source checks
on: [push, pull_request]
jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run-machine-baseline.py
      - run: bash -n scripts/start-demo.sh
      - name: Parse world and robot XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('worlds/maintenance.sdf')
          ET.parse('config/robot.urdf')
          PY
